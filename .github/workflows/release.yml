name: Release
# Gem-scanner fork: Windows-only release. Builds the installer plus the
# app.asar/manifest.json assets the in-app updater reads from this repo's
# releases (see RELEASES_REPO in src/shared/endpoints.ts). Linux/AUR jobs are
# dropped since they publish to upstream's package channels.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  release-win:
    # Pinned: windows-latest rotated to an image where node-gyp couldn't locate
    # Visual Studio to rebuild native dependencies. windows-2022 has the working toolchain.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python setuptools (needed by node-gyp)
        run: pip install setuptools
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Pack ASAR
        run: node scripts/pack-asar.js
      - name: Build installer (no publish - we handle that separately)
        run: npx electron-builder --win --x64 --publish never
      - name: Extract version
        id: version
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >>$GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Manual runs tag the release from package.json, so a build needs no
          # local tagging: bump the version, push, click "Run workflow".
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/v${{ steps.version.outputs.version }}/app.asar
            dist/v${{ steps.version.outputs.version }}/app.asar.unpacked.zip
            dist/v${{ steps.version.outputs.version }}/manifest.json
            dist/Scalpel-Setup.exe
